name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          echo "Runner: $(uname -a)"
          node --version || true
          npm --version || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure npm auth (optional)
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            npm whoami || true
          else
            echo "NPM_TOKEN not set; skipping npm auth"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Show dist contents (for troubleshooting)
        run: |
          if [ -d dist ]; then
            echo "dist:"
            ls -la dist
            find dist -maxdepth 2 -type f | sed -n '1,200p'
          else
            echo "dist folder not found"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Cleanup npmrc
        if: always()
        run: |
          if [ -f ~/.npmrc ]; then
            rm -f ~/.npmrc
            echo "Removed ~/.npmrc"
          fi
